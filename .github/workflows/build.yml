name: Build plugin

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Don't pull the LFS test frames: the build only needs the code, and skipping them
          # avoids burning LFS bandwidth on every CI run. The working tree keeps small pointers.
          lfs: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CaeloWorks.NINA.Benchmark/CaeloWorks.NINA.Benchmark.csproj

      - name: Build
        run: dotnet build CaeloWorks.NINA.Benchmark/CaeloWorks.NINA.Benchmark.csproj -c Release --no-restore

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaeloWorks.NINA.Benchmark
          # DLL only — the LFS test frames aren't fetched in CI (and would only be pointers here).
          path: CaeloWorks.NINA.Benchmark/bin/Release/net8.0-windows/CaeloWorks.NINA.Benchmark.dll
          if-no-files-found: error
